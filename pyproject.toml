[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ny-price-transparency"
version = "0.1.0"
description = "Reconciles hospital and payer federal price transparency disclosures for New York hospitals."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "ijson>=3.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
nypt-discover = "discovery.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "benchmark", "discovery", "hospital", "model", "payer", "reconcile"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agents", "benchmark", "discovery", "hospital", "model", "reconcile"]

[[tool.mypy.overrides]]
module = ["ijson.*", "openpyxl.*", "pyarrow.*"]
ignore_missing_imports = true
