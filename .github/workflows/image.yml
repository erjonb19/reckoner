name: image

# Publishes the job image to ghcr.io. No Azure Container Registry: ACR's cheapest
# tier is about $5/month, which would consume the entire subscription budget to
# host one small public image. ghcr.io is free for a public repository and needs
# no stored secret -- GITHUB_TOKEN is minted per run.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/reckoner-job

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # A moving `latest` plus an immutable sha tag: the job definition can
          # pin the sha when a run needs to be reproducible, which matters more
          # here than convenience since every published figure is traceable.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the entrypoint exists in the image
        # The wheel once shipped without reckoner_job.py: packages.find does not
        # see a top-level module, so the image built clean and would have died at
        # run time. This is that failure turned into a build-time one.
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            --stage manifest --dry-run
