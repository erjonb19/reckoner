# Scheduled Container Apps Job, applied with:
#   az containerapp job create --name reckoner-pipeline --resource-group rg-reckoner \
#       --environment reckoner-env --yaml deploy/job.scheduled.yaml
#
# YAML rather than the CLI's --args form, deliberately. `az containerapp job
# create --args="--stage manifest --dry-run"` accepts the string and stores it as
# a SINGLE argument, which argparse then rejects at run time; `job update --args`
# refuses multiple values outright. Both failures are silent until an execution
# runs. The list form below is unambiguous.
# The identity is NOT set here, and cannot be. Two ways of trying fail quietly:
# passing --mi-user-assigned alongside --yaml is ignored with a warning, and an
# `identity:` block in the YAML is rejected by `job update` with "Request
# requires identities to be assigned". Both leave a job that reports Succeeded
# with identityType None -- which would first surface as an auth failure against
# ADLS on the 1st of the month, with nothing before it to notice.
#
# So it is a separate, verified step:
#   az containerapp job identity assign --name reckoner-pipeline #       --resource-group rg-reckoner --user-assigned <identity resource id>
#   az containerapp job show ... --query identity.type    # must be UserAssigned
properties:
  environmentId: PLACEHOLDER_ENVIRONMENT_ID
  configuration:
    triggerType: Schedule
    replicaTimeout: 7200
    replicaRetryLimit: 1
    scheduleTriggerConfig:
      # 08:00 UTC on the 1st, two hours after the manifest check. Not an
      # ordering guarantee -- Container Apps offers none between jobs -- but a
      # gap wide enough that the drift check has finished and its result is in
      # Log Analytics before the mart reads the same layers. If the manifest
      # check failed, the mart's own numbers will be read next to that failure.
      cronExpression: "0 8 1 * *"
      parallelism: 1
      replicaCompletionCount: 1
  template:
    containers:
      - name: pipeline
        image: ghcr.io/erjonb19/reckoner/reckoner-job:latest
        args:
          - "--stage"
          - "mart"
        resources:
          # 4 vCPU / 8 GiB, the Consumption profile's ceiling. Sized from
          # measurement, not headroom: sharded, the stage peaked at 3,031 MiB by
          # its second shard and was killed on the third at 4,096. See ADR 0004
          # for the table -- three separate reductions got it from 9,808 to
          # 3,031 and none of them was enough, because the shard that kills it
          # is not the average one.
          cpu: 4.0
          memory: 8Gi
        env:
          - name: RECKONER_STORAGE
            value: adls
          - name: RECKONER_ADLS_ACCOUNT
            value: reckonerlake0914
          - name: RECKONER_ADLS_ROOT
            value: lake
          # DefaultAzureCredential resolves the user-assigned managed identity
          # from this. No secret exists in the image, the repo or this file.
          - name: AZURE_CLIENT_ID
            value: PLACEHOLDER_IDENTITY_CLIENT_ID
          # Where to ask whether Log Analytics is still accepting data. Read
          # through ARM with the same identity, which holds Reader on the
          # workspace; a subscription id is an identifier, not a credential, but
          # it is templated like the others so nothing environment-specific is
          # committed. Absent these, the job still runs and reports the cap
          # status as unknown with the reason attached -- never as "not capped".
          - name: RECKONER_SUBSCRIPTION_ID
            value: PLACEHOLDER_SUBSCRIPTION_ID
          - name: RECKONER_RESOURCE_GROUP
            value: rg-reckoner
          - name: RECKONER_LOG_WORKSPACE
            value: reckoner-logs
