# Phase 1 target code set -- the "30-50 high-value services" in docs/SPEC.md,
# mixed inpatient and outpatient, chosen for cross-hospital comparability.
#
# This is the filter that makes "parse once, land curated" real: an unfiltered
# ingest of all 72 MRFs is an overnight job producing hundreds of GB, most of it
# codes no comparison will ever use.
#
# Matching is on the code string only. Hospitals disagree about code_type
# spelling ("MS-DRG" / "MSDRG" / "DRG", "CPT" / "HCPCS" for the same code), so
# type is recorded but not required to match -- see hospital/codeset.py.

inpatient:
  # MS-DRG. High volume, high spend, and present at nearly every acute hospital.
  - code: "470"
    label: Major hip and knee joint replacement w/o MCC
  - code: "871"
    label: Septicemia w/o MV >96h w MCC
  - code: "291"
    label: Heart failure and shock w MCC
  - code: "193"
    label: Simple pneumonia and pleurisy w MCC
  - code: "247"
    label: Percutaneous cardiovascular proc w drug-eluting stent w/o MCC
  - code: "469"
    label: Major hip and knee joint replacement w MCC
  - code: "330"
    label: Major small and large bowel procedures w CC
  - code: "807"
    label: Vaginal delivery w/o sterilization w/o CC
  - code: "788"
    label: Cesarean section w/o sterilization w/o CC
  - code: "690"
    label: Kidney and urinary tract infections w/o MCC
  - code: "312"
